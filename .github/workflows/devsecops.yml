name: Pipeline DevSecOps

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Testes e verificacoes de seguranca
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 1. Detecta segredos no historico completo do Git.
      - name: Gitleaks - deteccao de segredos
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      # 2. Testes automatizados e qualidade do codigo.
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff - analise estatica
        run: ruff check .

      - name: Pytest - testes e cobertura
        run: pytest --cov=app --cov-report=xml --cov-report=term

      # 3. Analise SAST e Quality Gate do SonarCloud.
      - name: SonarCloud - analise e Quality Gate
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 4. Trivy: relatorio completo de dependencias.
      # Este relatorio e informativo e nao bloqueia por vulnerabilidades.
      - name: Trivy - relatorio de dependencias
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: trivy-fs-report.json
          exit-code: "0"

      # Bloqueia vulnerabilidades HIGH/CRITICAL com correcao disponivel.
      - name: Trivy - bloquear dependencias vulneraveis
        id: trivy_fs_gate
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      # 5. Construir a imagem local para analisar a mesma imagem
      # que sera potencialmente publicada.
      - name: Construir imagem Docker
        run: docker build -t ufla-shop:${{ github.sha }} .

      # Relatorio informativo da imagem, sem bloquear.
      - name: Trivy - relatorio completo da imagem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ufla-shop:${{ github.sha }}
          vuln-type: os,library
          severity: LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: trivy-image-report.json
          exit-code: "0"

      # Gate de seguranca da imagem Docker.
      - name: Trivy - bloquear imagem vulneravel
        id: trivy_image_gate
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ufla-shop:${{ github.sha }}
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      # 6. Gerar SBOM SPDX da imagem analisada.
      - name: Syft - gerar SBOM da imagem
        uses: anchore/sbom-action@v0
        with:
          image: ufla-shop:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-spdx-json
          upload-artifact: true

      # Guardar a imagem exata que passou pelas verificacoes.
      - name: Exportar imagem Docker
        run: docker save ufla-shop:${{ github.sha }} -o ufla-shop-image.tar

      - name: Armazenar imagem verificada
        uses: actions/upload-artifact@v6
        with:
          name: imagem-docker-verificada
          path: ufla-shop-image.tar
          retention-days: 7

      # Guardar os relatorios mesmo quando uma verificacao falhar.
      - name: Armazenar relatorios de seguranca
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: relatorios-devsecops
          path: |
            trivy-fs-report.json
            trivy-image-report.json
            coverage.xml
          if-no-files-found: ignore
          retention-days: 30

      # Falha somente depois de gerar e armazenar os artefatos.
      - name: Aplicar resultado final das verificacoes Trivy
        if: always()
        env:
          FS_GATE: ${{ steps.trivy_fs_gate.outcome }}
          IMAGE_GATE: ${{ steps.trivy_image_gate.outcome }}
        run: |
          if [ "$FS_GATE" = "failure" ] || [ "$IMAGE_GATE" = "failure" ]; then
            echo "Falha: foram encontradas vulnerabilidades bloqueantes."
            exit 1
          fi
          echo "Verificacoes bloqueantes do Trivy aprovadas."

  # Publicacao separada: so executa apos todas as verificacoes passarem.
  publish:
    name: Publicar imagem no GHCR
    runs-on: ubuntu-latest
    needs: security

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Baixar imagem verificada
        uses: actions/download-artifact@v6
        with:
          name: imagem-docker-verificada
          path: .

      - name: Carregar imagem Docker
        run: docker load -i ufla-shop-image.tar

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem aprovada
        env:
          REGISTRY: ghcr.io
          OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_NAME="$(echo "$OWNER/ufla-devops-shop" | tr '[:upper:]' '[:lower:]')"
          docker tag "ufla-shop:$IMAGE_TAG" "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
          docker tag "ufla-shop:$IMAGE_TAG" "$REGISTRY/$IMAGE_NAME:latest"
          docker push "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
          docker push "$REGISTRY/$IMAGE_NAME:latest"
